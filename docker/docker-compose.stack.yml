services:
  neo4j:
    image: neo4j:community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
    volumes:
      - neo4j_data:/data

  falkordb:
    image: falkordb/falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data

  ditto:
    image: eclipse/ditto:latest
    ports:
      - "8080:8080"

  thingsboard:
    image: thingsboard/tb-postgres
    ports:
      - "9090:9090"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  prometheus:
    image: prom/prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-szm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-szm}
      POSTGRES_DB: ${POSTGRES_DB:-szm_forge}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  # Optional engineering dashboards (connect to postgres)
  # Start with: docker compose --profile dashboards up -d
  superset:
    image: apache/superset:latest
    profiles: ["dashboards"]
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-szm_forge_superset_change_me}
    depends_on:
      - postgres

volumes:
  neo4j_data:
  falkordb_data:
  minio_data:
  postgres_data:
