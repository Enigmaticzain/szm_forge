name: SZM Forge Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-cpp:
    name: Build C++ Engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev
      - name: Configure CMake
        run: cmake -B build -S .
      - name: Build
        run: cmake --build build --parallel 4

  test-python:
    name: Test Python AI Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ai_service
        run: |
          PYTHONPATH=. python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then PYTHONPATH=. python3 -m pip install -r requirements.txt; fi
          PYTHONPATH=. python3 -m pip install pytest pytest-cov fastapi uvicorn pydantic
      - name: Syntax Check
        working-directory: ai_service
        run: |
          PYTHONPATH=. python3 -m py_compile *.py
      - name: Run Python Tests
        working-directory: ai_service
        env:
          PYTHONPATH: .
        run: |
          PYTHONPATH=. python3 -m pytest -q --tb=short || true

  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        working-directory: "new ui"
        run: npm ci
      - name: Build UI
        working-directory: "new ui"
        run: npm run build
      - name: Install Playwright Browsers
        working-directory: "new ui"
        run: npx playwright install --with-deps
      - name: Test UI (Unit)
        working-directory: "new ui"
        run: npm run test || true
      - name: Test UI (E2E)
        working-directory: "new ui"
        run: npm run test:e2e || true
